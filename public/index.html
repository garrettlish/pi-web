<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pi-web</title>
  <meta name="description" content="A local web UI for the pi coding agent: streamed transcripts, session history, and a full inspector for every LLM and tool call.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    // apply saved theme before first paint to avoid a flash
    document.documentElement.dataset.theme = localStorage.getItem("piweb-theme") || "dark";
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="logo">
          <svg class="logo-mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1677ff"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#logo-grad)"/>
            <path d="M9 11l5 5-5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 21h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">pi<span class="logo-dim">web</span></span>
        </span>
        <span class="sidebar-actions">
          <button id="btn-workspaces" class="icon-btn" title="Switch workspace" aria-label="Switch workspace">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
          <button id="btn-new-session" title="New session in this workspace">+ New</button>
        </span>
      </div>
      <div id="sidebar-tabs" class="sidebar-tabs" role="tablist" aria-label="Session views">
        <button id="tab-workspaces" role="tab" aria-selected="false">Workspaces</button>
        <button id="tab-recent" role="tab" aria-selected="true">Recent</button>
      </div>
      <div id="sidebar-crumb" class="sidebar-crumb hidden">
        <button id="btn-back-workspaces" class="icon-btn" title="All workspaces" aria-label="All workspaces">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="crumb-name"></span>
      </div>
      <input id="session-filter" type="search" placeholder="Filter sessions...">
      <div id="session-list" class="session-list"></div>
      <div id="sidebar-foot">
        <div id="pi-status" class="pi-status">connecting…</div>
      </div>
    </aside>

    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize · double-click to reset"></div>

    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <button id="btn-session-info" class="ghost icon-btn" title="Session details" aria-label="Session details"
                  aria-haspopup="dialog" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg>
          </button>
          <span id="session-name">—</span>
          <div id="session-info-pop" class="popover hidden" role="dialog" aria-label="Session details"></div>
        </div>
        <div class="topbar-right">
          <select id="model-select" class="hidden" title="Model"></select>
          <select id="thinking-select" class="hidden" title="Thinking level"></select>
          <span id="context-usage" class="badge" title="Context window usage">—</span>
          <span id="session-cost" class="badge" title="Session cost / tokens">—</span>
          <button id="btn-prompt-list" class="ghost icon-btn" title="User prompts in this session" aria-label="User prompts"
                  aria-haspopup="dialog" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <div id="prompt-list-pop" class="hidden" role="dialog" aria-label="User prompts"></div>
          <button id="btn-theme" class="ghost icon-btn" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
        </div>
      </header>

      <div id="transcript-wrap">
        <div id="transcript" tabindex="0"></div>
        <button id="btn-jump" class="hidden" title="Jump to latest">↓ latest</button>
      </div>

      <!-- status and queued messages live directly above the input, where the
           eye already is; in the header they were easy to miss -->
      <div id="composer-dock">
        <div id="status-bar" class="hidden"></div>
        <div id="queue-bar" class="hidden"></div>
        <div id="composer">
          <div id="attachments" class="attachments hidden"></div>
          <textarea id="input" rows="1" placeholder="Message pi…  (type / for commands & skills, drop images to attach, Enter to send, Shift+Enter for newline)"></textarea>
          <div class="composer-row">
            <span class="hint dim" id="composer-hint"></span>
            <span class="spacer"></span>
            <button id="btn-abort" class="danger hidden" title="Abort (Esc)">Stop</button>
            <button id="btn-send">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span id="modal-title">Details</span>
        <span class="spacer"></span>
        <button id="modal-raw" class="ghost hidden" title="Toggle raw JSON">Raw JSON</button>
        <button id="modal-copy" class="ghost" title="Copy JSON">Copy</button>
        <button id="modal-close" class="ghost" title="Close (Esc)">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="dialog-overlay" class="hidden">
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog-title"></div>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <span class="dim" id="dialog-hint"></span>
        <span class="spacer"></span>
        <button id="dialog-cancel" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div id="ws-overlay" class="hidden">
    <div id="ws-dialog" role="dialog" aria-modal="true" aria-label="Choose workspace directory">
      <div class="ws-dialog-head">Choose a workspace directory</div>
      <div class="ws-path-row">
        <button id="ws-up" class="icon-btn" title="Up one level" aria-label="Up one level">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <code id="ws-path" title=""></code>
      </div>
      <div id="ws-dirs" class="ws-dirs"></div>
      <div class="ws-dialog-foot">
        <button id="ws-home" class="ghost">Home</button>
        <span class="spacer"></span>
        <button id="ws-cancel" class="ghost">Cancel</button>
        <button id="ws-choose">Use this directory</button>
      </div>
    </div>
  </div>

  <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>pi-web needs JavaScript enabled to talk to the local agent process.</noscript>

  <script src="/app.js"></script>
</body>
</html>
